name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE checkout / build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.4-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"

  release:
    name: Build & publish release artifacts
    needs: test
    # Only ever cut a release from a tag that's actually on main - never
    # from a test/POC branch, even if someone tags one by mistake.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not reachable from main - refusing to publish a release."
            exit 1
          fi

      - name: Cache JUCE checkout / build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.4-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (universal x86_64 + arm64)
        # Pin the generator so the build layout is deterministic across
        # machines/runners regardless of what CMake would otherwise pick.
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"

      # JUCE's CMake support always appends $<CONFIG> to its output path
      # (see JUCEUtils.cmake: `products_folder = base_folder/$<CONFIG>`).
      # With CMAKE_BUILD_TYPE=Release set above, that means every artefact
      # lands under an extra .../Release/ folder - hence the path below.
      - name: Verify universal binaries
        run: |
          set -e
          for f in \
            build/G0G_artefacts/Release/VST3/G0G.vst3/Contents/MacOS/G0G \
            build/G0G_artefacts/Release/AU/G0G.component/Contents/MacOS/G0G \
            build/G0G_artefacts/Release/Standalone/G0G.app/Contents/MacOS/G0G; do
            echo "== $f =="
            lipo -info "$f" | grep -q "x86_64 arm64" || { echo "not universal: $f"; exit 1; }
          done

      - name: Package
        run: |
          cd build/G0G_artefacts/Release
          zip -r "${GITHUB_WORKSPACE}/G0G-macOS-universal.zip" VST3 AU Standalone

      - name: Build installer disk image
        # Double-click installer + uninstaller for non-technical users.
        # Unsigned unless Developer ID secrets are added (see installer/).
        env:
          DESCRIPTION: a monophonic 808 bass synthesizer
        run: ./installer/build_installer.sh build/G0G_artefacts/Release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            G0G-macOS-universal.zip
            dist/G0G-*-macOS.dmg
          generate_release_notes: true
          body: |
            **Easiest install:** download the `.dmg`, open it, and double-click *Install G0G.pkg*.
            The installer is not yet signed with an Apple developer certificate, so macOS will ask
            you to approve it once - the steps are in *READ ME FIRST.txt* inside the disk image.
            The `.zip` is the raw VST3 / AU / Standalone bundles for manual installs.

            Requires macOS 13 (Ventura) or newer. Universal: Intel and Apple Silicon.
